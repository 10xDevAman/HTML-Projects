<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Practice</title>
  </head>
  <body>
    <main>
     <section>
      <h1>Contact Us</h1>
        <form>
            <label for="name">Full Name:</label>
            <input type="text" id="name" />
            <br>
            <br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" id="">
            <br>
            <br>
            <label for="number">Number</label>
            <input type="number" name="number" id="number">
            <br>
            <br>
            <label for="message">Message:</label>
            <textarea name="message" id="message" cols="50" rows="5"></textarea>
            <br>
            <br>
            <button type="button">Send</button>
        </form>
      </section>
      <hr>
      <section id="userRegistrationForm">
        <h1>User Registration Form</h1>
        <form>
            <label for="username">User Name:</label>
            <input type="text" name="username" id="username">
            <br>
            <br>
            <label for="e-mail">Email:</label>
            <input type="e-mail" name="e-mail" id="e-mail">
            <br>
            <br>
            <label for="password">Password:</label>
            <input type="password" name="password" id="password">
            <br>
            <br>
            <label>Gender:</label>
            <!-- Note: value of name attribute is same in all radio buttons.-->
            <input type="radio" name="gender" id="male">
            <label for="male">Male</label>
            <input type="radio" name="gender" id="female">
            <label for="female">Female</label>
            <input type="radio" name="gender" id="others">
            <label for="others">Others</label>
            <br> 
            <br>
            <input type="checkbox" name="agreement" id="agree">
            <label for="agree">I agree the terms and conditions.</label>
            <br><br>
            <button>Register</button>
        </form>
      </section>
      <hr>
      <section>
        <h1>Feedback Form</h1>
        <form>
            <label for="yourname">Your Name:</label>
            <input type="text" name="name" id="yourname">
            <br>
            <br>
            <label for="youremail">Your Email:</label>
            <input type="email" name="email" id="youremail">
            <br>
            <br>
            <label>Rate Us</label>
            <input type="radio" name="rating" id="1star">
            <label for="1star">1 Star</label>
            <input type="radio" name="rating" id="2star">
            <label for="2star">2 Star</label>
            <input type="radio" name="rating" id="3star">
            <label for="3star">3 Star</label>
            <input type="radio" name="rating" id="4star">
            <label for="4star">4 Star</label>
            <input type="radio" name="rating" id="5star">
            <label for="5star">5 Star</label>
            <br><br>
            <label for="comments">Comments:</label>
            <textarea name="review" id="comments"></textarea>
            <br><br>
            <button>Submit Feedback</button>
        </form>
      </section>
      <hr>
      <section>
        <h1>Employee Detail Form</h1>
        <form>
            <label for="fname">Full Name:</label>
            <input type="text" name="nameOfEmployee" id="fname" placeholder="Enter your full name">
            <br>
            <br>
            <label for="e-email">Email:</label>
            <input type="email" name="email" id="e-email" placeholder="Enter your email sddress">
            <br>
            <br>
            <label for="p-number">Phone Number:</label>
            <input type="number" name="p-number" id="number" placeholder="Enter your phone number">
            <br>
            <br>    
            <label>Gender:</label>
            <input type="radio" name="e-gender" id="male-emp">
            <label for="male-emp">Male</label>
            <input type="radio" name="e-gender" id="female-emp">
            <label for="female-emp">Female</label>
            <input type="radio" name="e-gender" id="other-emp">
            <label for="other-emp">Other</label>
            <br>
            <br>
            <label for="jobTitle">Job Title:</label>
            <input type="text" name="title" id="jobTitle" placeholder="Enter your job title">
            <br>
            <br>
            <label for="department">Department:</label>
            <select name="department" id="department">
                <option value="associate intern">Associate Intern</option>
                <option value="associate technical consultant">Associate Technical Consultant</option>
                <option value="senior software engineer">Senior Software Engineer</option>
                <option value="business analyst">Business Analyst</option>
                <option value="Pre-Sales">Pre-Sales</option>
            </select>
            <br>
            <br>
            <button>Submit</button>
        </form>
      </section>
    </main>
  </body>
</html>
