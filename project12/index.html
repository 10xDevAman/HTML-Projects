<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Health Detail Form</title>
  </head>
  <body>
    <main>
      <h1 align="center">Health Detail Form</h1>
      <form>
        <fieldset>
          <legend>Personal Information</legend>
          <label for="name">Full Name:</label>
          <input type="text" id="name" />
          <br />
          <br />
          <label for="DOB">DOB:</label>
          <input type="date" name="DOB" id="DOB" />
          <br />
          <br />
          <label for="gender">Gender:</label>
          <select name="gender" id="gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
          <br />
          <br />
          <label for="number">Phone:</label>
          <input type="number" id="number" />
        </fieldset>
        <br />
        <fieldset>
          <legend>Medical History</legend>
          <label for="bloodgroup">Blood Group:</label>
          <select name="bloodgroup" id="bloodgroup">
            <option value="A positive">A+</option>
            <option value="B positive">B+</option>
            <option value="AB">AB</option>
            <option value="O positive">O+</option>
          </select>
          <br />
          <br />
          <label for="lenses or not"
            >Do you have glasses or contact lenses?</label
          >
          <br />
          <input type="radio" name="glasses or contact lenses" id="yes" />
          <label for="yes">Yes</label><br />
          <input type="radio" name="glasses or contact lenses" id="no" />
          <label for="no">No</label>
          <br />
          <br />
          <label for="pre-contition">Pre-existing Conditions:</label><br />
          <textarea
            name="Pre-existing Conditions"
            id="pre-condition"
            placeholder="List any pre-existing medical conditions"
            rows="5"
            cols="50"
          ></textarea>
          <br />
          <br />
          <label for="allergies">Allergies:</label><br />
          <input type="checkbox" name="allergies" id="pollen" />
          <label for="pollen">Pollen</label><br />
          <input type="checkbox" name="allergies" id="peanut" />
          <label for="peanut">Peanuts</label><br />
          <input type="checkbox" name="allergies" id="latex" />
          <label for="latex">Latex</label><br />
          <input type="checkbox" name="allergies" id="none" />
          <label for="none">None</label><br /><br />
          <label for="medications">Current Medications:</label><br />
          <textarea
            name="current medications"
            id="medications"
            placeholder="List any current medications"
            rows="5"
            cols="50"
          ></textarea
          ><br /><br />
        </fieldset>
        <br />
        <fieldset>
          <legend>Emergency Contact</legend>
          <label for="emergencycontactname">Emergency Contact Name:</label>
          <input type="text" id="emergencycontactname" />
          <br /><br />
          <label for="EmergencyContactNo">Emergency Contact Phone:</label>
          <input
            type="number"
            name="Emergency Contact Number"
            id="EmergencyContactNo"
          /><br /><br />
          <label for="relemergencycontactname"
            >Relationship to Emergency Contact:</label
          >
          <input type="text" id="relemergencycontactname" />
          <br /><br />
        </fieldset>
        <br />
        <button>Submit</button>
      </form>
    </main>
  </body>
</html>
