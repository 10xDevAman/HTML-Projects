<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested List - Practice</title>
</head>
<body>
    <ol>
        <li>Array</li>
            <ul type="square">
                <li>1D Array</li>
                <li>2D Array</li>
            </ul>
        <li>Linked List</li>
            <ul type="disk">
                <li>Silgly Linked List</li>
                <li>Doubly Linked List</li>
                <li>Circular Linked List</li>
                <ol type="a">
                    <li>Doubly Circular Linked List</li>
                    <li>Triply Circular Linked List</li>
                </ol>
            </ul>
        <li>Tree</li>
            <ul>
                <li>Binary Tree</li>
                <li>BST</li>
                <li>AVL</li>
                <li>Red Black Tree</li>
            </ul>
    </ol>
</body>
</html>
